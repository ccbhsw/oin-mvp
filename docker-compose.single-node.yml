services:
  observer-a:
    build: .
    restart: unless-stopped
    environment:
      OIN_NODE_NAME: alicloud-hk-a
      OIN_DATA_DIR: /var/lib/oin
      OIN_DISCOVERY_ENDPOINTS: https://oin.timfi.top
      OIN_DISCOVERY_REGION: HK
      OIN_PUBLIC_LOCKDOWN: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /srv/oin-data:/var/lib/oin
