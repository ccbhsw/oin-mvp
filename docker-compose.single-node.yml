services:
  observer-a:
    build: .
    restart: unless-stopped
    environment:
      OIN_NODE_NAME: alicloud-hk-a
      OIN_DATA_DIR: /var/lib/oin
      OIN_DISCOVERY_ENDPOINTS: http://<NODE_A_IP>:8000
      OIN_DISCOVERY_REGION: HK
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - /srv/oin-data:/var/lib/oin
