services:
  observer-a:
    build: .
    environment:
      OIN_NODE_NAME: observer-a
      OIN_DATA_DIR: /var/lib/oin
      OIN_ALLOW_PRIVATE_PEERS: "1"
      OIN_ALLOWED_PRIVATE_PEER_HOSTS: observer-a,observer-b,observer-c
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["observer-a-data:/var/lib/oin"]
    networks: [oin]

  observer-b:
    build: .
    environment:
      OIN_NODE_NAME: observer-b
      OIN_DATA_DIR: /var/lib/oin
      OIN_ALLOW_PRIVATE_PEERS: "1"
      OIN_ALLOWED_PRIVATE_PEER_HOSTS: observer-a,observer-b,observer-c
    ports: ["127.0.0.1:8002:8000"]
    volumes: ["observer-b-data:/var/lib/oin"]
    networks: [oin]

  observer-c:
    build: .
    environment:
      OIN_NODE_NAME: observer-c
      OIN_DATA_DIR: /var/lib/oin
      OIN_ALLOW_PRIVATE_PEERS: "1"
      OIN_ALLOWED_PRIVATE_PEER_HOSTS: observer-a,observer-b,observer-c
    ports: ["127.0.0.1:8003:8000"]
    volumes: ["observer-c-data:/var/lib/oin"]
    networks: [oin]

  # These adapter services are intentionally profiles-only. The default 3-node
  # development network uses separate SQLite files + file artifacts for zero-setup
  # isolation; production replaces each node's DB/storage settings independently.
  postgres:
    image: postgres:16-alpine
    profiles: [adapters]
    environment:
      POSTGRES_USER: oin
      POSTGRES_PASSWORD: change-me-development-only
      POSTGRES_DB: oin
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [oin]

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    profiles: [adapters]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: oinminio
      MINIO_ROOT_PASSWORD: change-me-development-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    networks: [oin]

  verifier:
    build: .
    profiles: [tools]
    entrypoint: ["oin"]
    command: ["verify", "/bundle"]
    volumes: ["./export:/bundle:ro"]
    networks: [oin]

volumes:
  observer-a-data:
  observer-b-data:
  observer-c-data:
  postgres-data:
  minio-data:

networks:
  oin:
    driver: bridge
