[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oin"
version = "0.1.0"
description = "Open Information Network MVP: signed, replicable public observations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "OIN Contributors"}]
dependencies = [
  "cryptography>=42.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]

[project.scripts]
oin = "oin.cli:app"

[tool.setuptools.packages.find]
include = ["oin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
