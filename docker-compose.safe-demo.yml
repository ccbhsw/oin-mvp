services:
  safe-demo:
    image: oin-mvp-safe:local
    user: "${OIN_DEMO_UID:-1000}:${OIN_DEMO_GID:-1000}"
    working_dir: /demo
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["python3", "/app/network-demo/tools/operator.py", "init", "/demo/data/operator-a", "--operator-id", "did:oin-local:safe-demo"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./network-demo:/demo/network-demo:ro
      - ./oin:/app/oin:ro
      - ./demo/data:/demo/data:rw
    network_mode: none
