<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OIN Record</title>
  <meta name="description" content="把一个网页记下来，并核对这份记录有没有被改过。" />
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e6e8e3; --surface: #f6f6f3; --ink: #1d211c; --muted: #61685e;
      --line: #d2d5ce; --accent: #1e4a3d; --accent-fg: #f6f6f3;
      --verify: #2a5a45; --held: #3d4a5c; --warn: #7a3e2e;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Source Sans 3", "Noto Sans SC", sans-serif;
    }
    header { border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent); }
    .bar, .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.25rem; }
    .bar { display: flex; justify-content: space-between; padding-top: 1rem; padding-bottom: 1rem; }
    .wrap { padding-top: 2.5rem; padding-bottom: 4rem; }
    h1 { font-family: "Source Serif 4", "Noto Serif SC", serif; font-weight: 500; font-size: 2rem; line-height: 1.3; letter-spacing: -0.02em; margin: 0; }
    h2 { font-family: "Source Serif 4", "Noto Serif SC", serif; font-weight: 500; font-size: 1.5rem; margin: .25rem 0 0; letter-spacing: -0.02em; }
    .lede { color: var(--muted); line-height: 1.7; max-width: 28rem; margin-top: 1rem; }
    .sheet {
      background: var(--surface); border-radius: 1.5rem; margin-top: 2rem;
      box-shadow: 0 0 0 1px rgb(29 33 28 / .07), 0 1px 2px rgb(29 33 28 / .04), 0 8px 24px rgb(29 33 28 / .05);
    }
    form { padding: 1.25rem; }
    label { display: block; font-size: .9rem; color: var(--muted); }
    input {
      width: 100%; height: 48px; margin-top: .5rem; border: 0; border-radius: .375rem;
      background: var(--bg); padding: 0 .9rem; font-family: "Source Code Pro", monospace; font-size: .9rem;
      box-shadow: 0 0 0 1px var(--line);
    }
    input:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
    button {
      height: 48px; min-width: 10rem; border: 0; border-radius: .375rem; background: var(--accent); color: var(--accent-fg);
      font-size: .9rem; font-weight: 500; cursor: pointer; padding: 0 1.1rem;
    }
    button:disabled { opacity: .7; cursor: wait; }
    .row { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: center; margin-top: 1rem; }
    .hint { font-size: .75rem; color: var(--muted); line-height: 1.5; }
    .mono { font-family: "Source Code Pro", monospace; font-size: 12px; word-break: break-all; }
    .idbox { background: var(--bg); padding: .65rem .75rem; margin-top: .7rem; border-radius: .375rem; }
    .field { display: grid; gap: .5rem; padding: 1.15rem 0; border-top: 1px solid var(--line); }
    .check { display: flex; gap: 1rem; padding: .6rem 0; border-top: 1px solid var(--line); font-size: .9rem; }
    .ok { color: var(--verify); width: 2.5rem; flex: 0 0 2.5rem; }
    .bad { color: var(--warn); width: 2.5rem; flex: 0 0 2.5rem; }
    .warn { color: var(--warn); font-size: .9rem; }
    .muted { color: var(--muted); }
    @media (min-width: 640px) {
      h1 { font-size: 2.25rem; }
      form { padding: 1.5rem; }
      .field { grid-template-columns: 7.5rem minmax(0,1fr); gap: 1.5rem; }
    }
    @media (max-width: 420px) { button { width: 100%; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <span style="font-weight:500;letter-spacing:.04em">OIN</span>
      <span class="muted" style="font-size:.9rem">公共测试节点</span>
    </div>
  </header>
  <div class="wrap">
    <h1>把网页写成一份<br/>可以回头核对的记录。</h1>
    <p class="lede">贴一个地址。节点会把它记下来，并告诉你签字是否还在、内容是否被改过、时间是谁说的。</p>
    <form id="form" class="sheet">
      <label for="url">网址</label>
      <input id="url" value="https://example.com" inputmode="url" autocomplete="off" spellcheck="false" />
      <div class="row">
        <p class="hint">测试环境，数据可能被重置。请勿用于生产。</p>
        <button id="go" type="submit">记录这个页面</button>
      </div>
    </form>
    <div id="out"></div>
  </div>
  <script>
    const API = "https://oin.timfi.top";
    const form = document.getElementById("form");
    const out = document.getElementById("out");
    const go = document.getElementById("go");
    const urlInput = document.getElementById("url");

    function looksLikeHttpUrl(value) {
      try {
        const u = new URL(value.trim());
        return (u.protocol === "http:" || u.protocol === "https:") && !!u.hostname;
      } catch { return false; }
    }
    function when(v) {
      if (!v) return "未知时间";
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return v;
      return new Intl.DateTimeFormat("zh-CN", { dateStyle: "medium", timeStyle: "short", timeZone: "UTC" }).format(d) + " UTC";
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c]));
    }
    function check(ok, label, hint) {
      return `<div class="check"><span class="${ok ? "ok" : "bad"}">${ok ? "通过" : "未过"}</span><div><strong>${label}</strong><div class="hint">${hint}</div></div></div>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!looksLikeHttpUrl(url)) {
        out.innerHTML = `<p class="warn" style="margin-top:1rem">请输入以 http:// 或 https:// 开头的完整网址。</p>`;
        return;
      }
      go.disabled = true;
      go.textContent = "正在记录";
      out.innerHTML = `<div class="sheet" style="padding:1.25rem 1.5rem">正在抓取并签字。通常十几秒，请不要关掉页面。</div>`;
      try {
        const capRes = await fetch(API + "/v1/captures", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ url, archive_format: "wacz", resource_type: "html" }),
        });
        let payload = null;
        try { payload = await capRes.json(); } catch {
          throw new Error("节点返回了无法阅读的内容。请稍后再试。");
        }
        if (capRes.status === 422 && payload && payload.detail && payload.detail.reason === "TIMESTAMP_EVIDENCE_REQUIRED") {
          const n = payload.detail.prior_observation_count;
          out.innerHTML = `<div class="sheet" style="padding:1.5rem 2rem">
            <p class="muted" style="font-size:.9rem;color:var(--held)">没有写成新记录</p>
            <h2>这份内容以前已经记过了</h2>
            <p>节点拒绝再写一条“新时间”的记录。这不是故障。有人如果把同一页内容重新签一次、换一个时间再交上来，系统会拦住——这正是它在防止时间被悄悄改掉。</p>
            <p class="muted">第一次记录仍然有效。如果确实需要再记一次，必须带上独立时间戳服务的盖章。</p>
            ${n != null ? `<p class="mono muted">库里已有 ${n} 条同一内容的记录</p>` : ""}
          </div>`;
          return;
        }
        if (!capRes.ok) {
          const msg = (payload && (payload.detail?.detail || payload.detail || payload.message)) || ("提交失败（" + capRes.status + "）。");
          throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
        }
        const id = payload.observation_id;
        const page = payload.manifest?.object?.canonical_url || url;
        const captured = payload.manifest?.capture?.captured_at;
        let verify = null, verifyError = null;
        try {
          const vRes = await fetch(API + "/v1/verify/" + encodeURIComponent(id));
          if (!vRes.ok) verifyError = "核对接口返回 " + vRes.status + "，记录已保存，但这一步没完成。";
          else verify = await vRes.json();
        } catch {
          verifyError = "记录已经写下，但核对这一步暂时连不上节点。";
        }
        const sig = verify?.manifest?.signature_valid === true;
        const hash = verify?.archive_hash_valid === true && verify?.raw_content_hash_valid === true && verify?.raw_content_bytes_valid === true;
        const mid = verify?.manifest?.manifest_id_valid === true;
        const overall = verify?.status === "VALID";
        const kind = verify?.timestamp?.kind || payload.timestamp_evidence?.kind;
        const third = kind === "rfc3161";
        out.innerHTML = `<div class="sheet" style="padding:1.5rem 2rem 2rem">
          <div style="display:flex;justify-content:space-between;gap:1rem">
            <div><p class="muted" style="font-size:.9rem;margin:0">记录</p><h2>已写入节点</h2></div>
            <p style="color:${overall ? "var(--verify)" : "var(--muted)"};font-size:.9rem">${overall ? "核对通过" : verify ? "核对未完全通过" : "已写下，待核对"}</p>
          </div>
          <div class="field"><p class="muted" style="margin:0">网址</p><div><p class="mono">${escapeHtml(page)}</p><p class="hint">${escapeHtml(when(captured))}</p></div></div>
          <div class="field"><p class="muted" style="margin:0">记录编号</p><div>
            <p>这串编号是这份记录的身份证。之后用它来核对内容有没有被改、签字还在不在。它不是网址，也不是密码。</p>
            <div class="idbox mono">${escapeHtml(id)}</div></div></div>
          <div class="field"><p class="muted" style="margin:0">核对</p><div>
            <p>系统在问三件事：签字是否对得上、抓下来的内容有没有被改过、编号是否对得上这份内容。</p>
            ${verifyError ? `<p class="warn">${escapeHtml(verifyError)}</p>` : `
              ${check(sig, "签字对得上", "这份记录确实是这个节点签过的，后来没有换成别人的签字。")}
              ${check(hash, "内容没有被改过", "现在存着的页面内容和当初抓下来的那一份对得上。")}
              ${check(mid, "编号对得上这份内容", "记录编号是从内容算出来的，对得上说明没有张冠李戴。")}
            `}
            ${overall ? `<p>可以这样理解：这份内容，确实是从这个网址、在上面这个时间点被记录下来的，之后没有被改过。</p>` : ""}
          </div></div>
          <div class="field"><p class="muted" style="margin:0">时间</p><div>
            <p><strong>${third ? "第三方盖章时间" : "节点自己声明的时间"}</strong></p>
            <p class="muted">${third
              ? "这份记录除了节点自己签字，还拿到了独立时间戳服务的盖章。盖章时间由第三方给出，提交的人改不了。"
              : "现在记下的时间，是这个公共测试节点自己说的。它能证明内容被签过名、没有被改过，但不能单独当成第三方时间证明。"}</p>
            <p class="hint">记录时间 ${escapeHtml(when(verify?.timestamp?.captured_at || captured))}${third && verify?.timestamp?.tsa_time ? " · 盖章时间 " + escapeHtml(when(verify.timestamp.tsa_time)) : ""}</p>
          </div></div>
        </div>`;
      } catch (err) {
        const msg = err && err.message ? err.message : "连不上存证节点。请检查网络后重试。";
        out.innerHTML = `<div class="sheet" style="padding:1.25rem 1.5rem"><p><strong>这次没记成</strong></p><p class="muted">${escapeHtml(msg)}</p></div>`;
      } finally {
        go.disabled = false;
        go.textContent = "记录这个页面";
      }
    });
  </script>
</body>
</html>
